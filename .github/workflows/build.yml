# CI: build + push gateway image to GHCR, plus release binaries.
#
# Tag policy (locked): version tags ONLY (v1.1.1-style) — main/dev
# pushes build nothing (iteration stays local: `docker build` + proof).
#   - git tag vX.Y.Z     -> :X.Y.Z + :latest (latest follows releases only)
# Local `docker build` stays for iteration; consumers pull, never build.
# Build needs zero secrets (all deps public); provenance + SBOM on.
# Release bins ride the same tag trigger: bins matrix (3 platforms,
# one artifact each, no publish inside) fans into the release job
# (semver gate duplicated, SHA256SUMS, 4 assets, replace on rerun).
name: build
"on":
  push:
    tags: ["v[0-9]*"]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Image name (lowercase for GHCR)
        id: image
        run: echo "name=ghcr.io/$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
      - name: Validate tag
        # Fail closed unless the ref is strict semver vX.Y.Z (the glob
        # alone still admits v1beta — FF-2).
        run: |
          if [[ ! "${GITHUB_REF#refs/tags/}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref must be strict semver vX.Y.Z, got ${GITHUB_REF#refs/tags/}"; exit 1
          fi
      - name: Tags
        id: tags
        run: |
          ver="${GITHUB_REF#refs/tags/v}"
          echo "list=${{ steps.image.outputs.name }}:$ver,${{ steps.image.outputs.name }}:latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.tags.outputs.list }}
          cache-from: type=gha,scope=localbridge
          cache-to: type=gha,scope=localbridge,mode=max
          provenance: mode=max
          sbom: true
  bins:
    needs: [build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    strategy:
      fail-fast: true
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: darwin
            goarch: arm64
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"
      - name: Build localbridge ${{ matrix.goos }}-${{ matrix.goarch }}
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: CGO_ENABLED=0 go build -trimpath -o localbridge-${{ matrix.goos }}-${{ matrix.goarch }} ./cmd/
      - uses: actions/upload-artifact@v4
        with:
          name: localbridge-${{ matrix.goos }}-${{ matrix.goarch }}
          path: localbridge-${{ matrix.goos }}-${{ matrix.goarch }}
          if-no-files-found: error
  release:
    needs: [build, bins]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Validate tag
        # Fail closed unless the ref is strict semver vX.Y.Z (the glob
        # alone still admits v1beta — FF-2).
        run: |
          if [[ ! "${GITHUB_REF#refs/tags/}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "ref must be strict semver vX.Y.Z, got ${GITHUB_REF#refs/tags/}"; exit 1
          fi
      - uses: actions/download-artifact@v4
        with:
          # Scope to our bins: the GHCR job's buildx artifact must never
          # land in dist/ (4th platform edits pattern + pre-check + matrix).
          pattern: localbridge-*
          path: dist
          merge-multiple: true
      - name: SHA256SUMS
        run: |
          cd dist
          sha256sum localbridge-* > SHA256SUMS
      - name: Asset pre-check
        # Fail closed unless all three platform binaries landed (a
        # short artifact set must never ship a partial Release).
        run: |
          for f in localbridge-linux-amd64 localbridge-linux-arm64 localbridge-darwin-arm64; do
            test -f "dist/$f" || { echo "missing asset: $f"; exit 1; }
          done
          test -f dist/SHA256SUMS || { echo "missing asset: SHA256SUMS"; exit 1; }
      - uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          allowUpdates: true
          replacesArtifacts: true
          artifactErrorsFailBuild: true
          artifacts: "dist/localbridge-*,dist/SHA256SUMS"
          token: ${{ secrets.GITHUB_TOKEN }}
