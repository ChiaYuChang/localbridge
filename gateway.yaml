# Desired-state example (Phase 1 installer model): the gateway installs
# declared downstreams at startup into /var/lib/mcp (receipts in
# state.json) and starts them from there — no global preinstalls.
# NOTE: repo-root config enters the Docker build context — never bake
# secrets into this file (there are none here by construction).
servers:
  filesystem:
    type: local
    profiles: [live]
    required: false
    # Installed binary (NOT npx: npx --no-install still hits the
    # registry for metadata, breaking offline serving; the pinned
    # 2026.8.31 install is receipts-tracked by construction).
    command: [/var/lib/mcp/bin/mcp-server-filesystem, /workspace]
    install:
      manager: npm
      package: "@modelcontextprotocol/server-filesystem"
      version: 2026.8.31
      binary: mcp-server-filesystem
  # time (mcp-server-time) OMITTED for now: its installer path
  # (uv tool install executable name + offline behavior) is unverified.
  # Re-add with an install stanza only after the contract is proven.
