# C2 compose startup (one-command gateway with Docker-secrets delivery).
#
# TRUST BOUNDARY (locked, honest): same-container downstreams are
# operator-trusted; secrets/env-sanitation prevent ACCIDENTAL propagation
# only, never malicious same-container credential access (file-backed
# compose secrets remain readable in-container; hard isolation would need
# a stronger process/container boundary). No in-repo secrets: operator
# credentials live OUTSIDE the repo (see bootstrap); direct-env fallback
# is a non-Compose contract (documented here, never a compose path).
# The single cache volume is shared trust state across runs — reset it
# explicitly (`docker compose down -v`) when a clean cache is required.
#
# This file itself is TRUSTED input: `file:` refs read host files at
# config-processing time. Never presented as a sandbox.
services:
  gateway:
    build: .
    image: local-mcp
    # Default entrypoint/cmd from the image (tini + entrypoint.sh +
    # gateway binary). MCP --profile flags pass via `command:` override,
    # e.g. `command: ["/opt/mcp/bin/gateway", "--config", "/opt/mcp/config/gateway.yaml", "--profile", "go"]`.
    # NOTE: compose `profiles:` key is NOT used — the name collides with
    # MCP --profile and would confuse both. Disclaimed explicitly.
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # Repo root mounts directly (absolute target; relative-target form
      # rejected).
      - .:/workspace:ro
      - cache:/var/lib/mcp
    environment:
      # Docker-secrets delivery (Go resolves _FILE -> var, then unsets
      # _FILE; direct env preserved when _FILE absent).
      OPENAI_TUNNEL_ID_FILE: /run/secrets/tunnel_id
      OPENAI_API_KEY_FILE: /run/secrets/api_key
      # Runner caches (frozen values so G1-sanitized children keep
      # runners functional; PIPX_BIN_DIR/HOME choice documented: HOME is
      # /tmp per image contract, binaries land via explicit env below).
      npm_config_cache: /var/lib/mcp/npm
      UV_CACHE_DIR: /var/lib/mcp/uv
      PIPX_HOME: /var/lib/mcp/pipx
      PIPX_BIN_DIR: /var/lib/mcp/pipx/bin
      HOME: /tmp
    secrets:
      - tunnel_id
      - api_key
    # NO restart key (short-lived design; daemon behavior via user
    # override file, never default). NO ports (tunnel-attached only).
    #
    # SECRET BOOTSTRAP (root/sudo REQUIRED for the chown — stated
    # explicitly, no silent assumption; rootful-only: the chown/chmod
    # below need privilege, there is no rootless bootstrap path).
    # NEVER commit. No `.example` secret files (example secrets invite
    # accidents — docs show printf commands instead):
    #   mkdir -p ~/Private/secrets/openai_tunnel
    #   printf %s "$TUNNEL_ID" > ~/Private/secrets/openai_tunnel/tunnel_id
    #   printf %s "$API_KEY" > ~/Private/secrets/openai_tunnel/api_key
    #   sudo chown 10001:10001 ~/Private/secrets/openai_tunnel/tunnel_id ~/Private/secrets/openai_tunnel/api_key
    #   chmod 0400 ~/Private/secrets/openai_tunnel/tunnel_id ~/Private/secrets/openai_tunnel/api_key
    # Compose file-backed secrets preserve host ownership/mode
    # (`uid`/`gid`/`mode` keys are IGNORED locally with a warning);
    # without the chown the fixed `USER mcp` gets Permission denied
    # (probed failure, not theory).

secrets:
  tunnel_id:
    file: ${HOME}/Private/secrets/openai_tunnel/tunnel_id
  api_key:
    file: ${HOME}/Private/secrets/openai_tunnel/api_key

volumes:
  cache:
